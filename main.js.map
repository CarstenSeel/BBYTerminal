module.exports = "<div fxLayout=\"column\" class=\"minCard\">\r\n    <h1>Schlaf hinzufügen</h1>\r\n    <form [formGroup]=\"form\" fxLayout=\"column\" fxFlex=\"0 0 100\">\r\n        <!-- sleep Start time Input -->\r\n        <p class=\"inputLabelTime\">Start Zeitpunkt:</p>\r\n        <mat-form-field class=\"startDatePicker\" fxFlex=\"1 0 auto\">\r\n            <input matInput [owlDateTime]=\"starttime\" [owlDateTimeTrigger]=\"starttime\" class=\"customInput\" formControlName=\"starttime\">\r\n            <owl-date-time #starttime></owl-date-time>\r\n            <mat-error *ngIf=\"form.controls.starttime.hasError('required')\">\r\n                Bitte die Einschlafzeit eingeben\r\n            </mat-error>\r\n        </mat-form-field>\r\n        <!-- sleep end time input -->\r\n        <p class=\"inputLabelTime\">End Zeitpunkt:</p>\r\n        <mat-form-field class=\"startDatePicker\" fxFlex=\"1 0 auto\">\r\n            <input matInput [owlDateTime]=\"endtime\" [owlDateTimeTrigger]=\"endtime\" class=\"customInput\" formControlName=\"endtime\">\r\n            <owl-date-time #endtime></owl-date-time>\r\n            <mat-error *ngIf=\"form.controls.endtime.hasError('required')\">\r\n                Bitte die Aufwachzeit eingeben\r\n            </mat-error>\r\n        </mat-form-field>\r\n    </form>\r\n \r\n    <!-- Button Area -->\r\n    <div fxFlex=\"0 1 auto\" fxLayout=\"row\" fxLayoutGap=\"10px\" fxLayoutAlign=\"space-between center\">\r\n        <button class=\"borderRadius\" fxFlex=\"0 1 50\" mat-raised-button (click)=\"saveChanges()\">Speichern</button>\r\n        <button class=\"borderRadius\" fxFlex=\"0 1 50\" mat-raised-button (click)=\"closeDialog()\">Abbrechen</button>\r\n    </div>\r\n</div>"
