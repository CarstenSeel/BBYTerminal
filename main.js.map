module.exports = "<div class=\"minCard\" fxLayout=\"column\">\r\n    <div fxFlex=\"1 1 25\">\r\n        <h1>Termin Löschen</h1>\r\n    </div>\r\n    <div fxFlex=\"1 1 25\">\r\n        <span>Möchten Sie den Termin:&nbsp;</span> <b> {{data.name}} </b> <span>&nbsp;wirklich löschen?</span> \r\n    </div>\r\n\r\n    <!-- Buttons -->\r\n    <div fxFlex=\"1 1 50\" fxLayoutAlign=\"end\">\r\n        <div fxFlex=\"1 1 100\" fxLayout=\"row\" fxLayoutAlign=\"space-between end\">\r\n            <button fxFlex=\"0 0 45\" class=\"borderRadius\" mat-raised-button (click)=\"delete(true)\" mat-button fxLayoutAlign=\"center center\">Ja</button>\r\n            <button fxFlex=\"0 0 45\" class=\"borderRadius\" mat-raised-button (click)=\"delete(false)\" mat-button fxLayoutAlign=\"center center\">Nein</button>\r\n        </div>\r\n    </div>\r\n</div>"
