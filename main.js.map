module.exports = "<div fxFlex=\"100\" fxLayout=\"column\" class=\"contentCard\">\r\n    <!-- content room -->\r\n  <div fxFlex=\"0 1 100\" fxLayout=\"column\" style=\"overflow: auto;\">\r\n    <mat-card class=\"mainCard\">\r\n      <mat-card-header class=\"mainCardTitle\" fxLayoutAlign=\"center center\">\r\n        <h1>Schlaf</h1>\r\n      </mat-card-header>\r\n      <mat-divider></mat-divider>\r\n      <mat-card-content class=\"contentCardContent\">\r\n        <!-- Sleep Chart -->\r\n            <canvas id=\"SleepChart\" class=\"sleepChart\">{{chart}}</canvas>\r\n      </mat-card-content>\r\n    </mat-card>\r\n  </div>\r\n\r\n  <!-- btn room  -->\r\n  <div fxFlex=\"0 1 10\" fxLayoutAlign=\"end\" fxLayout=\"row\">\r\n    <div fxFlex=\"1 1 50\" fxLayout=\"row\" fxLayoutAlign=\"start center\">\r\n      <mat-icon (click)=\"removeSleep()\" class=\"addBTN\">remove_circle</mat-icon>\r\n    </div>\r\n    <div fxFlex=\"1 1 50\" fxLayout=\"row\" fxLayoutAlign=\"end center\">\r\n      <mat-icon (click)=\"addSleep()\" class=\"addBTN\">add_circle</mat-icon>\r\n    </div>\r\n  </div>\r\n</div>"
