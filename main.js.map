module.exports = "<div fxFlex=\"100\" fxLayout=\"column\">\r\n  <div class=\"header\">\r\n    <mat-card class=\"card\">\r\n      <mat-card-content class=\"cardContent\">\r\n        <!-- toggle sidebar button -->\r\n        <div class=\"sidebarToggleBtn\">\r\n          <mat-icon (click)=\"toggleSidebar()\" class=\"sidebarBtnToggle\">menu</mat-icon>\r\n        </div>\r\n        <!-- Header Text -->\r\n        <div class=\"headerText\">\r\n          <h2>BBYTerminal</h2>\r\n        </div>\r\n        <!-- Datepicker area -->\r\n        <div class=\"headerDatepicker\">\r\n          <!-- from datepicker -->\r\n          <mat-form-field class=\"startDatePicker\" appearance=\"none\">\r\n            <mat-label>Filter von:</mat-label>\r\n            <input matInput [disabled]=\"true\" [matDatepicker]=\"startDateDefaultPicker\" (dateChange)=\"startDateChange($event)\" [formControl]=\"startDateDefault\" style=\"width: 80px;\">\r\n            <mat-datepicker-toggle matSuffix [for]=\"startDateDefaultPicker\" [disabled]=\"false\"></mat-datepicker-toggle>\r\n            <mat-datepicker #startDateDefaultPicker [disabled]=\"false\"></mat-datepicker>\r\n          </mat-form-field>\r\n          <!-- to datepicker -->\r\n          <mat-form-field class=\"endDatePicker\" appearance=\"none\">\r\n            <mat-label>Filter bis:</mat-label>\r\n            <input matInput [disabled]=\"true\" [matDatepicker]=\"endDateDefaultPicker\" (dateChange)=\"endDateChange($event)\" [formControl]=\"endDateDefault\">\r\n            <mat-datepicker-toggle matSuffix [for]=\"endDateDefaultPicker\" [disabled]=\"false\"></mat-datepicker-toggle>\r\n            <mat-datepicker #endDateDefaultPicker [disabled]=\"false\"></mat-datepicker>\r\n          </mat-form-field>\r\n        </div>\r\n      </mat-card-content>\r\n    </mat-card>\r\n  </div>\r\n</div>\r\n"
