module.exports = "<div class=\"minCard\" fxLayout=\"column\">\r\n    <div fxFlex=\"1 1 25\">\r\n        <h1>Schlaf Löschen</h1>\r\n    </div>\r\n    <!-- Date of Entry that should be deleted Input -->\r\n    <div fxFlex=\"1 1 25\">\r\n        <mat-form-field class=\"choiceDatePicker\" appearance=\"none\">\r\n            <input matInput [disabled]=\"true\" [matDatepicker]=\"choiceDate\" (dateChange)=\"choiceDateChange($event)\" [formControl]=\"choiceDateDefault\">\r\n            <mat-datepicker-toggle matSuffix [for]=\"choiceDate\" [disabled]=\"false\"></mat-datepicker-toggle>\r\n            <mat-datepicker #choiceDate [disabled]=\"false\" [startAt]=\"choiceDate\"></mat-datepicker>\r\n          </mat-form-field>\r\n    </div>\r\n    <!-- Entry that should be deleted Select -->\r\n    <div fxFlex=\"1 1 25\">\r\n        <form [formGroup]=\"form\">\r\n                <mat-form-field class=\"customSelect\" appearance=\"none\">\r\n                <mat-label>Wählen Sie einen Eintrag aus</mat-label>\r\n                <mat-select formControlName=\"option\">\r\n                    <mat-option *ngFor=\"let option of options\" [value]=\"option\">{{option.startDate | date: 'dd.MM.yyyy'}} {{option.duration}}Stunden</mat-option>\r\n                </mat-select>\r\n            </mat-form-field>\r\n        </form>\r\n    </div>\r\n\r\n    <!-- Button Area -->\r\n    <div fxFlex=\"1 1 25\" fxLayoutAlign=\"end\" style=\"margin-top:12px\">\r\n        <div fxFlex=\"1 1 100\" fxLayout=\"row\" fxLayoutAlign=\"space-between end\">\r\n            <button fxFlex=\"0 0 45\" class=\"borderRadius\" mat-raised-button (click)=\"delete()\" mat-button fxLayoutAlign=\"center center\">Ja</button>\r\n            <button fxFlex=\"0 0 45\" class=\"borderRadius\" mat-raised-button (click)=\"noDelete()\" mat-button fxLayoutAlign=\"center center\">Nein</button>\r\n        </div>\r\n    </div>\r\n</div>"
