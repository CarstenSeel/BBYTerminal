module.exports = "<div fxLayout=\"column\" class=\"minCard\">\r\n    <h1>Windel hinzufügen</h1>\r\n    <form [formGroup]=\"form\" fxLayout=\"column\" fxFlex=\"0 0 100\">\r\n        <!-- type Select -->\r\n        <p class=\"inputLabel\">Windelinhalt:</p>\r\n        <div fxFlex=\"1 0 auto\">\r\n            <mat-radio-group fxFlex=\"1 0 auto\" formControlName=\"type\">\r\n                <mat-radio-button value=\"Urin\" class=\"customRadio\">Urin</mat-radio-button>\r\n                <mat-radio-button value=\"Stuhl\" class=\"customRadio\">Stuhl</mat-radio-button>\r\n                <mat-radio-button value=\"Beides\" class=\"customRadio\">Beides</mat-radio-button>\r\n            </mat-radio-group>\r\n        </div>\r\n        <!-- time Input -->\r\n        <p class=\"inputLabelTime\">Zeitpunkt:</p>\r\n        <mat-form-field class=\"startDatePicker\" fxFlex=\"1 0 auto\">\r\n            <input matInput [owlDateTime]=\"time\" [owlDateTimeTrigger]=\"time\" class=\"customInput\" formControlName=\"time\">\r\n            <owl-date-time #time></owl-date-time>\r\n            <mat-error *ngIf=\"form.controls.time.hasError('required')\">\r\n                Bitte einen Wechselzeitpunkt eingeben\r\n            </mat-error>\r\n        </mat-form-field>\r\n    </form>\r\n    <!-- Button Area -->\r\n    <div fxFlex=\"0 1 auto\" fxLayout=\"row\" fxLayoutGap=\"10px\" fxLayoutAlign=\"space-between center\">\r\n        <button class=\"borderRadius\" fxFlex=\"0 1 50\" mat-raised-button (click)=\"saveChanges()\">Speichern</button>\r\n        <button class=\"borderRadius\" fxFlex=\"0 1 50\" mat-raised-button (click)=\"closeDialog()\">Abbrechen</button>\r\n    </div>\r\n</div>"
