<div class="mainPage" fxFlex="100" fxLayout="row">
  <!-- sidebar Content (only shown if sideBarOpen == true) -->
    <div class="sidebar" fxFlex="100" fxLayout="column" *ngIf="sideBarOpen">
      <!-- dashboard navigation -->
        <div fxLayout="row" fxLayoutAlign="center center" (click)="moveToDashboard()" class="sidebarBtn">
          <div fxFlex="30"><mat-icon>dashboard</mat-icon></div>
          <div fxFlex="70"><span>Dashboard</span></div>
        </div>
        <!-- appointments navigation -->
        <div fxLayout="row" fxLayoutAlign="center center" (click)="moveToAppointments()" class="sidebarBtn">
          <div fxFlex="30"><mat-icon>date_range</mat-icon></div>
          <div fxFlex="70"><span>Arzttermine</span></div>
        </div>
        <!-- size navigation -->
        <div fxLayout="row" fxLayoutAlign="center center" (click)="moveToSize()" class="sidebarBtn">
          <div fxFlex="30"><mat-icon>straighten</mat-icon></div>
          <div fxFlex="70"><span>Größe</span></div>
        </div>
        <!-- weight navigation -->
        <div fxLayout="row" fxLayoutAlign="center center" (click)="moveToWeight()" class="sidebarBtn">
          <div fxFlex="30"><mat-icon>timeline</mat-icon></div>
          <div fxFlex="70"><span>Gewicht</span></div>
        </div>
        <!-- diapers navigation -->
        <div fxLayout="row" fxLayoutAlign="center center" (click)="moveToDiapers()" class="sidebarBtn">
          <div fxFlex="30"><mat-icon>wc</mat-icon></div>
          <div fxFlex="70"><span>Windeln</span></div>
        </div>
        <!-- food navigation -->
        <div fxLayout="row" fxLayoutAlign="center center" (click)="moveToFood()" class="sidebarBtn">
          <div fxFlex="30"><mat-icon>restaurant</mat-icon></div>
          <div fxFlex="70"><span>Essen</span></div>
        </div>
        <!-- sleep navigation -->
        <div fxLayout="row" fxLayoutAlign="center center" (click)="moveToSleep()" class="sidebarBtn">
          <div fxFlex="30"><mat-icon>hotel</mat-icon></div>
          <div fxFlex="70"><span>Schlaf</span></div>
        </div>
    </div>
  </div>
